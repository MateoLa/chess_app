  borges1: En su grave rincón, los jugadores <br>
           rigen las lentas piezas. El tablero <br>
           los demora hasta el alba en su severo <br>
           ámbito en que se odian dos colores.
  borges2: Cuando los jugadores se hayan ido, <br >
           cuando el tiempo los haya consumido, <br >
           ciertamente no habrá cesado el rito.
  borges3: En el Oriente se encendió esta guerra <br >
           cuyo anfiteatro es hoy toda la Tierra. <br >
           Como el otro, este juego es infinito.
  borges4: Tenue rey, sesgo alfil, encarnizada reina, <br>
           torre directa y peon ladino <br >
           sobre lo negro y blanco del camino <br >
           buscan y libran su batalla armada.
  borges5: No saben que la mano señalada <br > 
           del jugador gobierna su destino, <br >
           no saben que un rigor adamantino <br >
           sujeta su albedrío y su jornada.
  borges6: También el jugador es prisionero <br > 
           de otro tablero <br >
           de negras noches y de blancos días.
  borges7: Dios mueve al jugador, y éste la pieza. <br >
           ¿Que Dios detrás de Dios la trama empieza <br >
           de polvo y tiempo y sueño y agonía?
