services:
    postgres:
        image: postgres:18-alpine
        container_name: postgres
        environment:
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        ports:
            - "5432:5432"
        volumes:
            - postgres:/var/lib/postgresql
        networks:
            - app-network

    app:
        container_name: chessPwa
        depends_on:
            - postgres
        build:
            context: .
            dockerfile: Dockerfile.development
            args:
                GITHUB_TOKEN: ${GITHUB_TOKEN}
        volumes:
            - bundle_cache:/usr/local/bundle
            - .:/rails
        environment:
            RAILS_ENV: development
            DB_HOST: postgres
            DB_PORT: 5432
            DB_USERNAME: ${DB_USERNAME}
            DB_PASSWORD: ${DB_PASSWORD}
            RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
            DISABLE_SPRING: 1
        command: bash -c "rm -rf tmp/pids/server.pid && bin/dev -b 0.0.0.0"
        ports:
            - "${APP_PORT:-3000}:3000"
        networks:
            - app-network

    jobs:
        container_name: chessPwaJobs
        build:
            context: .
            dockerfile: Dockerfile.development
        command: ./bin/jobs
        volumes:
            - .:/rails
        environment:
            RAILS_ENV: development
            DB_HOST: postgres
            DB_PORT: 5432
            DB_USERNAME: ${DB_USERNAME}
            DB_PASSWORD: ${DB_PASSWORD}
            RAILS_MASTER_KEY: ${RAILS_MASTER_KEY}
        networks:
            - app-network

volumes:
    postgres:
    bundle_cache:

networks:
    app-network:
        driver: bridge

